<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Makes the page responsive on different screen sizes. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Todo App</title>

    <link rel="stylesheet" href="todo.css" />
  </head>

  <body>
    <h1 id="main_heading">Todo App</h1>

    <div class="grid-container input-container">
      <input id="todo-input" type="text" placeholder="Enter Todo here" />

      <input id="todo-date" type="date" />

      <button class="add-button" onclick="addTodo()">Add</button>
    </div>

    <div class="todo-container grid-container"></div>

    <script src="todo.js"></script>
  </body>
</html>
